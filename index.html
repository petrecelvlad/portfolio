<!doctype html>
<html lang="en" data-skin="gamified">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vlad Petre | Game Producer</title>
    <meta name="description" content="Vlad Petre, game producer building games since 2007, from hypercasual to midcore. Over 30 games made across design, art, code and marketing." />
    <link rel="canonical" href="https://petrecelvlad.github.io/portfolio/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The card LinkedIn, chat apps and social sites draw when the link is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vlad Petre" />
    <meta property="og:title" content="Vlad Petre | Game Producer" />
    <meta property="og:description" content="Vlad Petre, game producer building games since 2007, from hypercasual to midcore. Over 30 games made across design, art, code and marketing." />
    <meta property="og:url" content="https://petrecelvlad.github.io/portfolio/" />
    <meta property="og:image" content="https://petrecelvlad.github.io/portfolio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vlad Petre, Game Producer: the portfolio's hero section" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vlad Petre",
        "jobTitle": "Game Producer",
        "url": "https://petrecelvlad.github.io/portfolio/",
        "sameAs": ["https://www.linkedin.com/in/petrevlad/"]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Kalam:wght@400;700&family=Silkscreen:wght@400;700&family=Press+Start+2P&family=Pixelify+Sans:wght@700&family=Jersey+15&family=Jersey+10&family=Jersey+25&family=Jersey+10+Charted&family=Jersey+25+Charted&family=Micro+5&display=swap" />

    <script>
      // YouTube's iframe API script itself is injected lazily by BentoVideoFrame
      // (only once a project video is actually reached) — this handler just has
      // to already exist by the time that script finishes loading.
      window.onYouTubeIframeAPIReady = function() {
        window.dispatchEvent(new CustomEvent('yt-ready'));
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
