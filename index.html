    <script>
      // YouTube's iframe API script itself is injected lazily by BentoVideoFrame
      // (only once a project video is actually reached) — this handler just has
      // to already exist by the time that script finishes loading.
      window.onYouTubeIframeAPIReady = function() {
        window.dispatchEvent(new CustomEvent('yt-ready'));
      };
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
